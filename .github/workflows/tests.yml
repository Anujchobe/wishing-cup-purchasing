name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python 3.11, no AI key
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # PuLP ships its own CBC solver. If that build can't run on the Mac runner,
      # the app falls back to an installed CBC, so install one there.
      - name: Install the CBC solver (macOS)
        if: runner.os == 'macOS'
        run: brew install cbc

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Fresh start with no AI key
        run: python run.py --check

      - name: Tests
        run: python -m pytest
